<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Filmory 영화 검색"
  >

  <title>영화 검색 | Filmory</title>

  <link
    rel="stylesheet"
    href="/static/css/style.css"
  >
</head>

<body>
  <header id="nav"></header>

  <main class="page">
    <section class="page-head">
      <span class="eyebrow">
        SEARCH
      </span>

      <h1>
        어떤 영화를 찾고 있나요?
      </h1>

      <p>
        제목을 입력해 작품 정보와 감상 기록을 확인하세요.
      </p>
    </section>

    <form
      id="searchForm"
      class="search-bar"
    >
      <input
        id="query"
        type="search"
        aria-label="영화 제목"
        placeholder="예: 인터스텔라"
        autocomplete="off"
        required
      >

      <button
        class="btn primary"
        type="submit"
      >
        검색
      </button>
    </form>

    <p
      id="status"
      class="status"
      aria-live="polite"
    ></p>

    <section
      id="results"
      class="movie-grid"
      aria-label="영화 검색 결과"
    ></section>
  </main>

  <footer>
    © 2026 Filmory
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/search.js"></script>
</body>
</html>
